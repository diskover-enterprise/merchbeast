<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" fill="none" aria-label="Merch Beast Godzilla mascot">
  <defs>
    <filter id="g" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="195" cy="432" rx="110" ry="8" fill="rgba(91,108,255,0.18)" stroke="#5b6cff" stroke-width="1" opacity=".6"/>

  <!-- TAIL — sweeps right and down behind the body -->
  <path d="M 255 310
           Q 310 330 355 310
           Q 395 290 390 255
           Q 385 230 365 238
           Q 350 245 355 262"
        fill="rgba(91,108,255,0.07)" stroke="#5b6cff" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Tail tip spines -->
  <path d="M 388 252 L 398 238 L 395 254" fill="rgba(91,108,255,0.2)" stroke="#5b6cff" stroke-width="1.5"/>
  <path d="M 380 244 L 388 228 L 386 244" fill="rgba(91,108,255,0.15)" stroke="#5b6cff" stroke-width="1.3"/>

  <!-- LEFT LEG -->
  <path d="M 148 305
           Q 132 345 122 385
           Q 118 405 132 410
           Q 145 414 152 400
           L 158 370
           Q 163 335 165 305 Z"
        fill="rgba(91,108,255,0.09)" stroke="#5b6cff" stroke-width="3"/>
  <!-- Left foot toes -->
  <path d="M 118 406 L 100 416" stroke="#5b6cff" stroke-width="3" stroke-linecap="round"/>
  <path d="M 130 411 L 118 424" stroke="#5b6cff" stroke-width="3" stroke-linecap="round"/>
  <path d="M 148 408 L 142 422" stroke="#5b6cff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- RIGHT LEG -->
  <path d="M 245 305
           Q 258 345 264 385
           Q 268 405 255 410
           Q 242 414 236 400
           L 232 370
           Q 228 335 230 305 Z"
        fill="rgba(91,108,255,0.09)" stroke="#5b6cff" stroke-width="3"/>
  <!-- Right foot toes -->
  <path d="M 268 406 L 286 416" stroke="#5b6cff" stroke-width="3" stroke-linecap="round"/>
  <path d="M 256 411 L 268 424" stroke="#5b6cff" stroke-width="3" stroke-linecap="round"/>
  <path d="M 238 408 L 244 422" stroke="#5b6cff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- MAIN BODY -->
  <path d="M 138 180
           Q 112 205 108 255
           Q 105 295 138 315
           Q 162 328 200 328
           Q 238 328 262 315
           Q 295 295 292 255
           Q 288 205 262 180
           Q 238 162 200 160
           Q 162 162 138 180 Z"
        fill="rgba(91,108,255,0.07)" stroke="#5b6cff" stroke-width="3.5" filter="url(#g)"/>

  <!-- Chest plate -->
  <path d="M 162 198
           Q 200 188 238 198
           L 232 270
           Q 200 280 168 270 Z"
        fill="rgba(91,108,255,0.13)" stroke="#5b6cff" stroke-width="2"/>
  <!-- Chest segment lines -->
  <path d="M 166 220 Q 200 214 234 220" stroke="#5b6cff" stroke-width="1.2" opacity=".5"/>
  <path d="M 164 242 Q 200 236 236 242" stroke="#5b6cff" stroke-width="1.2" opacity=".45"/>
  <path d="M 166 262 Q 200 257 234 262" stroke="#5b6cff" stroke-width="1.2" opacity=".4"/>

  <!-- Scale texture flanks -->
  <path d="M 118 230 Q 132 224 146 230" stroke="#5b6cff" stroke-width="1.3" opacity=".4"/>
  <path d="M 112 258 Q 128 252 142 258" stroke="#5b6cff" stroke-width="1.3" opacity=".35"/>
  <path d="M 116 284 Q 130 278 144 284" stroke="#5b6cff" stroke-width="1.3" opacity=".3"/>
  <path d="M 254 230 Q 268 224 282 230" stroke="#5b6cff" stroke-width="1.3" opacity=".4"/>
  <path d="M 258 258 Q 272 252 286 258" stroke="#5b6cff" stroke-width="1.3" opacity=".35"/>
  <path d="M 256 284 Q 270 278 284 284" stroke="#5b6cff" stroke-width="1.3" opacity=".3"/>

  <!-- LEFT ARM — short, raised, claws out -->
  <path d="M 138 200
           Q 102 210 88 242
           Q 82 262 96 270
           Q 110 276 120 260
           L 132 232
           Q 138 212 142 200 Z"
        fill="rgba(91,108,255,0.09)" stroke="#5b6cff" stroke-width="2.5"/>
  <!-- Left claws -->
  <path d="M 88 264 L 72 256" stroke="#5b6cff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 90 272 L 74 270" stroke="#5b6cff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 94 278 L 80 282" stroke="#5b6cff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- RIGHT ARM — raised, menacing -->
  <path d="M 262 200
           Q 298 210 312 242
           Q 318 262 304 270
           Q 290 276 280 260
           L 268 232
           Q 262 212 258 200 Z"
        fill="rgba(91,108,255,0.09)" stroke="#5b6cff" stroke-width="2.5"/>
  <!-- Right claws -->
  <path d="M 312 264 L 328 256" stroke="#5b6cff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 310 272 L 326 270" stroke="#5b6cff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 306 278 L 320 282" stroke="#5b6cff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- DORSAL SPINES — iconic row, largest at center -->
  <path d="M 235 168 L 238 128 L 248 155 Z" fill="rgba(91,108,255,0.12)" stroke="#5b6cff" stroke-width="2"/>
  <path d="M 248 175 L 256 130 L 264 162 Z" fill="rgba(91,108,255,0.14)" stroke="#5b6cff" stroke-width="2.2"/>
  <path d="M 258 188 L 270 140 L 278 175 Z" fill="rgba(91,108,255,0.16)" stroke="#5b6cff" stroke-width="2.4" filter="url(#g)"/>
  <path d="M 264 205 L 280 158 L 286 195 Z" fill="rgba(91,108,255,0.18)" stroke="#5b6cff" stroke-width="2.5" filter="url(#g)"/>
  <path d="M 268 228 L 286 184 L 292 220 Z" fill="rgba(91,108,255,0.16)" stroke="#5b6cff" stroke-width="2.3" filter="url(#g)"/>
  <path d="M 270 252 L 288 214 L 293 246 Z" fill="rgba(91,108,255,0.13)" stroke="#5b6cff" stroke-width="2"/>
  <path d="M 268 276 L 286 244 L 290 270 Z" fill="rgba(91,108,255,0.11)" stroke="#5b6cff" stroke-width="1.8"/>
  <path d="M 264 298 L 280 270 L 284 294 Z" fill="rgba(91,108,255,0.09)" stroke="#5b6cff" stroke-width="1.5"/>

  <!-- HEAD — large, boxy, reptilian -->
  <path d="M 158 90
           Q 162 58 200 52
           Q 238 58 242 90
           Q 248 118 242 148
           Q 232 168 200 172
           Q 168 168 158 148
           Q 152 118 158 90 Z"
        fill="rgba(91,108,255,0.10)" stroke="#5b6cff" stroke-width="3.5" filter="url(#g)"/>

  <!-- Head bumps/cranial ridges -->
  <path d="M 165 78 Q 200 68 235 78" stroke="#5b6cff" stroke-width="2" opacity=".55"/>
  <path d="M 160 95 Q 200 85 240 95" stroke="#5b6cff" stroke-width="1.5" opacity=".4"/>

  <!-- Brow ridge — heavy, fierce -->
  <path d="M 160 112
           Q 176 102 196 107
           Q 200 108 204 107
           Q 224 102 240 112"
        fill="none" stroke="#5b6cff" stroke-width="3.5"/>

  <!-- Eye sockets -->
  <ellipse cx="178" cy="122" rx="14" ry="10" fill="#020408" stroke="#5b6cff" stroke-width="2.5"/>
  <ellipse cx="222" cy="122" rx="14" ry="10" fill="#020408" stroke="#5b6cff" stroke-width="2.5"/>
  <!-- Iris glow -->
  <ellipse cx="178" cy="122" rx="8" ry="8" fill="#5b6cff" filter="url(#glow)"/>
  <ellipse cx="222" cy="122" rx="8" ry="8" fill="#5b6cff" filter="url(#glow)"/>
  <!-- Slit pupils -->
  <ellipse cx="178" cy="122" rx="2" ry="7" fill="#020408"/>
  <ellipse cx="222" cy="122" rx="2" ry="7" fill="#020408"/>
  <!-- Eye highlight -->
  <circle cx="182" cy="118" r="2" fill="#eef0fa" opacity=".7"/>
  <circle cx="226" cy="118" r="2" fill="#eef0fa" opacity=".7"/>

  <!-- Snout / upper jaw -->
  <path d="M 166 140
           Q 200 133 234 140
           L 238 158
           Q 218 165 200 167
           Q 182 165 162 158 Z"
        fill="rgba(91,108,255,0.15)" stroke="#5b6cff" stroke-width="2.5"/>

  <!-- Lower jaw — open, snarling -->
  <path d="M 164 158
           Q 182 152 200 153
           Q 218 152 236 158
           Q 238 172 236 183
           Q 218 195 200 197
           Q 182 195 164 183
           Q 162 172 164 158 Z"
        fill="rgba(91,108,255,0.18)" stroke="#5b6cff" stroke-width="2.5"/>

  <!-- Nostrils -->
  <ellipse cx="192" cy="148" rx="4" ry="2.5" fill="#5b6cff" opacity=".7"/>
  <ellipse cx="208" cy="148" rx="4" ry="2.5" fill="#5b6cff" opacity=".7"/>

  <!-- Upper teeth -->
  <path d="M 172 158 L 175 172 L 180 158" fill="#f3f5ff" stroke="#5b6cff" stroke-width="1.3" opacity=".95"/>
  <path d="M 183 156 L 186 171 L 191 156" fill="#f3f5ff" stroke="#5b6cff" stroke-width="1.2" opacity=".9"/>
  <path d="M 196 155 L 199 170 L 204 155" fill="#f3f5ff" stroke="#5b6cff" stroke-width="1.2" opacity=".9"/>
  <path d="M 209 156 L 214 171 L 218 156" fill="#f3f5ff" stroke="#5b6cff" stroke-width="1.2" opacity=".9"/>
  <path d="M 221 158 L 226 172 L 230 158" fill="#f3f5ff" stroke="#5b6cff" stroke-width="1.3" opacity=".95"/>

  <!-- Lower teeth -->
  <path d="M 175 183 L 178 171 L 183 183" fill="#f3f5ff" stroke="#5b6cff" stroke-width="1.2" opacity=".85"/>
  <path d="M 188 185 L 191 172 L 196 185" fill="#f3f5ff" stroke="#5b6cff" stroke-width="1.1" opacity=".8"/>
  <path d="M 204 185 L 209 172 L 214 185" fill="#f3f5ff" stroke="#5b6cff" stroke-width="1.1" opacity=".8"/>
  <path d="M 218 183 L 222 171 L 227 183" fill="#f3f5ff" stroke="#5b6cff" stroke-width="1.2" opacity=".85"/>

  <!-- Atomic breath glow from mouth -->
  <ellipse cx="200" cy="185" rx="24" ry="10" fill="rgba(91,108,255,0.35)" filter="url(#glow)"/>
  <ellipse cx="200" cy="190" rx="14" ry="6" fill="rgba(91,108,255,0.5)" filter="url(#glow)"/>

  <!-- Side head ridges / ear frills -->
  <path d="M 158 100 Q 144 92 146 108 Q 148 120 158 118"
        fill="rgba(91,108,255,0.14)" stroke="#5b6cff" stroke-width="2.5"/>
  <path d="M 242 100 Q 256 92 254 108 Q 252 120 242 118"
        fill="rgba(91,108,255,0.14)" stroke="#5b6cff" stroke-width="2.5"/>

  <!-- Atomic energy particles drifting up -->
  <circle cx="196" cy="198" r="2.5" fill="#5b6cff" opacity=".7" filter="url(#g)"/>
  <circle cx="204" cy="202" r="1.8" fill="#5b6cff" opacity=".5"/>
  <circle cx="200" cy="208" r="1.4" fill="#5b6cff" opacity=".35"/>
  <circle cx="193" cy="212" r="1" fill="#5b6cff" opacity=".25"/>
  <circle cx="207" cy="215" r="1" fill="#5b6cff" opacity=".2"/>
</svg>
